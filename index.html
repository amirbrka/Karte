<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Steiermark – Gebiete</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#map{position:fixed;inset:0;background:#ddd;overflow:hidden;touch-action:none}
#tiles{position:absolute;left:0;top:0;will-change:transform}
.tile{position:absolute;width:256px;height:256px;user-select:none;-webkit-user-drag:none}
#overlay{position:absolute;inset:0;pointer-events:none}
svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.area{stroke:#063b68;stroke-width:2;fill-opacity:.35;vector-effect:non-scaling-stroke}
.label{font-size:18px;font-weight:800;fill:#111;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round;text-anchor:middle}
#ui{position:absolute;z-index:10;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.box{pointer-events:auto;background:rgba(255,255,255,.94);border-radius:10px;padding:8px 10px;box-shadow:0 2px 12px #0003}
button{border:0;background:#fff;border-radius:8px;padding:7px 10px;font-size:15px}
#info{font-size:13px;line-height:1.3}
#zoom{margin-left:auto;display:flex;flex-direction:column;gap:3px}
#zoom button{font-size:22px;width:40px;height:40px;padding:0}
#loading{position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 2px 15px #0003}
</style>
</head>
<body>
<div id="map">
  <div id="tiles"></div>
  <div id="overlay"><svg id="svg"></svg></div>
  <div id="loading">Karte wird geladen …</div>
</div>
<div id="ui">
  <div class="box" id="info"><b>Steiermark – Gebiete</b><br>Zoomen wie bei einer Navi-Karte</div>
  <div class="box" id="zoom"><button id="plus">+</button><button id="minus">−</button></div>
</div>

<script>
/* Keine externe JavaScript-Bibliothek: die Datei funktioniert dadurch auch dann,
   wenn CDN-Skripte wie Leaflet blockiert werden. Die Hintergrundkarte kommt
   direkt von OpenStreetMap. */
const map=document.getElementById('map'), tiles=document.getElementById('tiles'),
svg=document.getElementById('svg'), loading=document.getElementById('loading');

const areas=[
["33","#8bc34a",[[47.48,14.05],[47.49,14.30],[47.42,14.55],[47.28,14.48],[47.22,14.20],[47.28,13.98],[47.40,13.95]]],
["45","#f4d35e",[[47.48,14.30],[47.55,14.65],[47.45,14.95],[47.34,14.95],[47.22,14.48],[47.28,14.48],[47.42,14.55]]],
["49","#f3a6c8",[[47.34,14.95],[47.45,14.95],[47.38,15.22],[47.26,15.28],[47.13,15.02],[47.12,14.77],[47.22,14.48]]],
["48","#1f78b4",[[47.55,14.65],[47.61,14.95],[47.50,15.10],[47.34,15.00],[47.38,15.22],[47.50,15.30],[47.58,15.12],[47.63,14.82]]],
["40","#b8b8b8",[[47.63,14.82],[47.75,15.05],[47.67,15.38],[47.55,15.52],[47.48,15.30],[47.50,15.10],[47.61,14.95]]],
["26","#f1dc3d",[[47.67,15.38],[47.72,15.70],[47.55,15.86],[47.42,15.70],[47.39,15.45],[47.48,15.30],[47.55,15.52]]],
["37","#1aa7d8",[[47.55,15.86],[47.65,16.05],[47.50,16.25],[47.34,16.23],[47.31,15.95],[47.42,15.70],[47.55,15.70]]],
["38","#d4b4dc",[[47.34,16.23],[47.18,16.32],[47.06,16.15],[47.10,15.90],[47.31,15.95]]],
["39","#e7c3a2",[[47.34,15.95],[47.31,15.70],[47.16,15.64],[47.10,15.43],[47.24,15.34],[47.39,15.45]]],
["29","#e0c85b",[[47.16,15.64],[47.08,15.75],[46.98,15.72],[46.92,15.56],[47.00,15.39],[47.10,15.43]]],
["10","#9ac43c",[[47.10,15.43],[47.00,15.39],[46.88,15.30],[46.79,15.45],[46.82,15.67],[46.98,15.72],[47.08,15.75]]],
["14","#49a45a",[[46.88,15.30],[46.80,15.17],[46.70,15.18],[46.67,14.90],[46.78,14.78],[46.90,15.00]]],
["15","#1769aa",[[47.13,15.02],[47.12,14.77],[46.98,14.88],[46.90,15.00],[46.88,15.30],[47.00,15.39],[47.10,15.43],[47.24,15.34],[47.26,15.28]]]
];

let z=8, center={lat:47.2,lon:14.95}, dragging=false,lastX=0,lastY=0;

function worldXY(lat,lon,zoom){
 const n=2**zoom, x=(lon+180)/360*n;
 const r=lat*Math.PI/180, y=(1-Math.asinh(Math.tan(r))/Math.PI)/2*n;
 return [x,y];
}
function tileURL(x,y,z){
 return `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
}
function renderTiles(){
 const W=innerWidth,H=innerHeight,n=2**z,[cx,cy]=worldXY(center.lat,center.lon,z);
 const minX=Math.floor(cx-W/512)-1,maxX=Math.floor(cx+W/512)+1;
 const minY=Math.floor(cy-H/512)-1,maxY=Math.floor(cy+H/512)+1;
 tiles.innerHTML="";
 tiles.style.width=(W+512)+"px";tiles.style.height=(H+512)+"px";
 for(let tx=minX;tx<=maxX;tx++)for(let ty=minY;ty<=maxY;ty++){
   if(ty<0||ty>=n)continue;
   const img=new Image();img.className="tile";
   const wx=((tx%n)+n)%n;
   img.src=tileURL(wx,ty,z);
   img.style.left=(W/2+(tx-cx)*256)+"px";
   img.style.top=(H/2+(ty-cy)*256)+"px";
   img.onerror=()=>img.style.background="#ccc";
   tiles.appendChild(img);
 }
 loading.style.display="none";
 renderAreas();
}
function renderAreas(){
 const W=innerWidth,H=innerHeight,[cx,cy]=worldXY(center.lat,center.lon,z);
 svg.innerHTML="";
 for(const [name,color,pts] of areas){
   const p=document.createElementNS("http://www.w3.org/2000/svg","polygon");
   p.classList.add("area");p.style.fill=color;
   p.setAttribute("points",pts.map(([lat,lon])=>{
     const [x,y]=worldXY(lat,lon,z);
     return `${W/2+(x-cx)*256},${H/2+(y-cy)*256}`;
   }).join(" "));
   svg.appendChild(p);
   let sx=0,sy=0;pts.forEach(([lat,lon])=>{const [x,y]=worldXY(lat,lon,z);sx+=W/2+(x-cx)*256;sy+=H/2+(y-cy)*256});
   const t=document.createElementNS("http://www.w3.org/2000/svg","text");
   t.classList.add("label");t.textContent=name;t.setAttribute("x",sx/pts.length);t.setAttribute("y",sy/pts.length);
   svg.appendChild(t);
 }
}
function moveByPixels(dx,dy){
 const [x,y]=worldXY(center.lat,center.lon,z);
 const nx=x-dx/256,ny=y-dy/256,n=2**z;
 const lon=nx/n*360-180;
 const merc=Math.PI*(1-2*ny/n);
 const lat=180/Math.PI*Math.atan(Math.sinh(merc));
 center={lat,lon};renderTiles();
}
function zoomAt(delta,px=innerWidth/2,py=innerHeight/2){
 const old=worldXY(center.lat,center.lon,z);
 z=Math.max(5,Math.min(18,z+delta));
 const nw=worldXY(center.lat,center.lon,z);
 const dx=(nw[0]-old[0])*256,dy=(nw[1]-old[1])*256;
 moveByPixels(dx*(px/innerWidth*0+1)-px*(2**(z)/2**(z- delta)-1),dy*(py/innerHeight*0+1)-py*(2**(z)/2**(z-delta)-1));
 renderTiles();
}
map.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1:-1,e.clientX,e.clientY)},{passive:false});
map.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;map.setPointerCapture(e.pointerId)});
map.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;moveByPixels(dx,dy)});
map.addEventListener('pointerup',()=>dragging=false);
document.getElementById('plus').onclick=()=>zoomAt(1);
document.getElementById('minus').onclick=()=>zoomAt(-1);
addEventListener('resize',renderTiles);
renderTiles();
</script>
</body>
</html>
